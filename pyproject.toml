[project]
name = "z1-7axis"
version = "0.1.0"
description = "Unitree Z1 extended to 7 axes, MuJoCo"
requires-python = ">=3.12"
dependencies = [
    "mujoco>=4.0.0",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "typer>=0.28.0",
]

[project.scripts]
mjt = "tools.mjt:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
